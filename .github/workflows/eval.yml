# Blocking checks on every PR and on pushes to main (SOTA VER-1):
# shellcheck + ruff + mypy + SKILL.md spec validation, then the demo smoke check demo/eval.sh.
name: Eval
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r .github/requirements-lint.txt
      - run: shellcheck demo/eval.sh
      - run: ruff check demo/run.py scripts/validate_skill.py scripts/test_validate_skill.py
      - run: mypy --strict demo/run.py scripts/validate_skill.py scripts/test_validate_skill.py
      - name: Validate SKILL.md (Agent Skills spec)
        run: python scripts/validate_skill.py .
      - name: Validator negative fixtures
        run: python scripts/test_validate_skill.py
  eval:
    name: demo/eval.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash demo/eval.sh
