# Checks on every PR and on pushes to main (SOTA VER-1). They block merges only
# once both jobs are required status checks on main (repo settings).
# shellcheck + ruff + mypy, then demo/eval.sh and its self-test demo/eval_selftest.py.
name: Eval
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: lint + typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes --no-deps -r .github/requirements-lint.txt
      # shellcheck comes from the hash-pinned shellcheck-py above (setup-python puts it first on PATH)
      - run: command -v shellcheck && shellcheck --version && shellcheck demo/eval.sh
      - run: ruff check demo/
      - run: mypy --strict demo/run.py demo/eval_selftest.py
  eval:
    name: demo/eval.sh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash demo/eval.sh
      - run: python3 demo/eval_selftest.py
