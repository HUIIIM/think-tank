# Blocks PRs that add dependencies with known high/critical CVEs or copyleft licenses. vertciti standard SEC-4.
name: Dependency Review
on: [pull_request]
permissions:
  contents: read
jobs:
  review:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          deny-licenses: "GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0"
