version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
  # Hash-pinned lint tools used by the Eval workflow (vertciti standard SEC-2).
  - package-ecosystem: "pip"
    directory: "/.github"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    open-pull-requests-limit: 5
